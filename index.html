<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Priyanshu, yeh line ensure karti hai ki humari website mobile aur desktop dono par sahi size ki dikhe. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Priyanshu, SEO ke liye yeh Meta Tags bohot zaroori hain. Google search mein website ko upar laane mein help karte hain. -->
    <meta name="description" content="An interactive Data Structures and Algorithms (DSA) Visualizer. Learn sorting algorithms and data structures through step-by-step animations.">
    <meta name="keywords" content="DSA, Data Structures, Algorithms, Visualizer, Sorting Algorithms, Bubble Sort, Learn Code, Interactive Learning">
    <meta name="author" content="semicolon;">
    
    <!-- Priyanshu, yeh Open Graph tags hain, jab link WhatsApp ya social media par share karoge toh accha preview aayega. -->
    <meta property="og:title" content="DSA Visualizer - Learn Algorithms Interactively">
    <meta property="og:description" content="Visualize sorting algorithms and data structures step-by-step with our interactive tool.">
    <meta property="og:type" content="website">

    <title>DSA Visualizer - Learn Algorithms Interactively</title>
    
    <!-- Priyanshu, yahan hum Google Fonts se fancy fonts import kar rahe hain. 
         Yeh humari text ko sundar banayenge. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <!-- Priyanshu, yeh highlight.js ka CSS hai, jo code snippets ko rang-biranga (syntax highlight) karega. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    
    <!-- Priyanshu, yeh humari apni CSS file hai jahan humne website ko style kiya hai. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Priyanshu, yeh humari website ka top header hai. -->
    <header>
        <h1>DSA Visualizer</h1>
        <!-- Priyanshu, aaj humne yeh do buttons add kiye hain controls ke liye! -->
        <div class="controls">
            <select id="algorithm-select">
                <option value="bubble">Bubble Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="insertion">Insertion Sort</option>
                <option value="merge">Merge Sort</option>
                <option value="quick">Quick Sort</option>
            </select>
            <div class="slider-group">
                <label for="size-slider">Size:</label>
                <input type="range" id="size-slider" min="10" max="100" value="20">
            </div>
            <div class="slider-group">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="10" max="1000" value="100">
            </div>
            <button id="generate-btn">Generate Array</button>
            <button id="play-btn">Play</button>
        </div>
    </header>
    
    <main>
        <!-- Priyanshu, is section main algorithms ke bars (dande) move hote hue dikhenge, animations yahi hongi. -->
        <section id="visualization-area">
            <div class="placeholder">Algorithm Visualization Area</div>
        </section>
        
        <aside id="code-panel">
            <h2>Reference Code</h2>
            <div id="reference-code-container" class="code-container">
                <!-- Lines injected here dynamically -->
            </div>
            <div id="complexity-panel" style="margin-top: 1rem; padding: 1rem; border-radius: 8px; background: rgba(0,0,0,0.2);">
                <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem;">Complexity</h3>
                <p style="margin: 0.2rem 0;">Time: <strong id="time-complexity">O(n²)</strong></p>
                <p style="margin: 0.2rem 0;">Space: <strong id="space-complexity">O(1)</strong></p>
            </div>
        </aside>
    </main>

    <!-- Priyanshu, yeh script tag highlight.js ko chalata hai taaki code colors main dikhe. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/c.min.js"></script>
    
    <!-- Priyanshu, yeh humari main JavaScript file hai, jisme saara logic likha hoga. -->
    <script src="script.js"></script>
</body>
</html>
