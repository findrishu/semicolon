<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Tushar, this ensures the viewport is scaled correctly for both mobile and desktop devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tushar, these meta tags are essential for SEO, improving the website's visibility on search engines. -->
    <meta name="description" content="An interactive Data Structures and Algorithms (DSA) Visualizer. Learn sorting algorithms and data structures through step-by-step animations.">
    <meta name="keywords" content="DSA, Data Structures, Algorithms, Visualizer, Sorting Algorithms, Bubble Sort, Learn Code, Interactive Learning">
    <meta name="author" content="semicolon;">
    
    <!-- Tushar, these Open Graph tags provide rich previews when the link is shared on social media platforms. -->
    <meta property="og:title" content="DSA Visualizer - Learn Algorithms Interactively">
    <meta property="og:description" content="Visualize sorting algorithms and data structures step-by-step with our interactive tool.">
    <meta property="og:type" content="website">

    <title>DSA Visualizer - Learn Algorithms Interactively</title>
    
    <!-- Tushar, importing external typography from Google Fonts. 
         Yeh humari text ko sundar banayenge. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <!-- Tushar, this CSS file from highlight.js provides syntax highlighting for the code snippets. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    
    <!-- Tushar, this links to our primary stylesheet defining the application's visual design. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tushar, this section represents the top navigation header of the application. -->
    <header>
        <h1>DSA Visualizer</h1>
        <!-- Tushar, added these buttons to serve as the primary execution controls. -->
        <div class="controls">
            <select id="algorithm-select">
                <optgroup label="Sorting Algorithms">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="quick">Quick Sort</option>
                </optgroup>
                <optgroup label="Data Structures">
                    <option value="stack">Stack Operations</option>
                    <option value="queue">Queue Operations</option>
                    <option value="linkedlist">Linked List Insert</option>
                    <option value="tree">Tree Traversal</option>
                </optgroup>
            </select>
            <div class="slider-group">
                <label for="size-slider">Size:</label>
                <input type="range" id="size-slider" min="10" max="100" value="20">
            </div>
            <div class="slider-group">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="10" max="1000" value="100">
            </div>
            <button id="generate-btn">Generate Array</button>
            <button id="play-btn">Play</button>
        </div>
    </header>
    
    <main>
        <!-- Tushar, this is the primary visualization canvas where the algorithmic animations will be rendered. -->
        <section id="visualization-area">
            <div class="placeholder">Algorithm Visualization Area</div>
        </section>
        
        <aside id="code-panel">
            <h2>Reference Code</h2>
            <div id="reference-code-container" class="code-container">
                <!-- Lines injected here dynamically -->
            </div>
            <div id="complexity-panel" style="margin-top: 1rem; padding: 1rem; border-radius: 8px; background: rgba(0,0,0,0.2);">
                <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem;">Complexity</h3>
                <p style="margin: 0.2rem 0;">Time: <strong id="time-complexity">O(n²)</strong></p>
                <p style="margin: 0.2rem 0;">Space: <strong id="space-complexity">O(1)</strong></p>
                
                <div style="margin-top: 1rem; padding-top: 0.5rem; border-top: 1px solid var(--border-color);">
                    <p style="margin: 0.2rem 0;">Comparisons: <strong id="comparisons-count">0</strong></p>
                    <p style="margin: 0.2rem 0;">Swaps: <strong id="swaps-count">0</strong></p>
                </div>
            </div>
        </aside>
    </main>

    <!-- Tushar, this script initializes highlight.js to apply syntax coloring to the code blocks. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/c.min.js"></script>
    
    <!-- Tushar, this links to our main JavaScript file containing the application's core logic. -->
    <script src="script.js"></script>
</body>
</html>
